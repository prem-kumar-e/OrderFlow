name: Deploy Product Service (Beanstalk)

on:
  workflow_dispatch:  # manual trigger only — never runs automatically

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::514422154631:role/github-actions-orderflow-deploy
          aws-region: ap-southeast-1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish app
        run: dotnet publish ProductService/ProductService.csproj -c Release -o publish-output

      - name: Zip artifact
        run: |
          cd publish-output
          zip -r ../product-service-${{ github.sha }}.zip .

      - name: Upload to S3 (EB versions bucket)
        run: |
          aws s3 cp product-service-${{ github.sha }}.zip s3://elasticbeanstalk-ap-southeast-1-514422154631/product-service-${{ github.sha }}.zip

      - name: Create application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name OrderFlow \
            --version-label product-${{ github.sha }} \
            --source-bundle S3Bucket="elasticbeanstalk-ap-southeast-1-514422154631",S3Key="product-service-${{ github.sha }}.zip"

      - name: Deploy to environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name orderflow-product-env-dev \
            --version-label product-${{ github.sha }}