name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: ProductService, path: ProductService/ProductService.csproj }
          - { name: OrderService, path: OrderService/OrderService.csproj }
          - { name: NotificationService, path: NotificationService/NotificationService.csproj }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ${{ matrix.service.path }}

      - name: Build
        run: dotnet build ${{ matrix.service.path }} --configuration Release --no-restore

      # Add this back in once you have actual test projects
      # - name: Test
      #   run: dotnet test ${{ matrix.service.path }} --no-build