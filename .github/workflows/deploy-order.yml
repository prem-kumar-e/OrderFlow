name: Deploy Order Service (Lambda)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::514422154631:role/github-actions-orderflow-deploy
          aws-region: ap-southeast-1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Lambda tools
        run: dotnet tool install -g Amazon.Lambda.Tools

      - name: Deploy
        working-directory: OrderService
        run: |
          export PATH="$PATH:/home/runner/.dotnet/tools"
          dotnet lambda deploy-serverless \
            --template serverless.template \
            --stack-name orderflow-order-service \
            --s3-bucket orderflow-lambda-deploys-210343 \
            --region ap-southeast-1 \
            --template-parameters "ProductServiceUrl=${{ vars.PRODUCT_SERVICE_URL }};OrderEventsQueueUrl=${{ vars.ORDER_EVENTS_QUEUE_URL }}"